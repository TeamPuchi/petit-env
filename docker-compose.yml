# dev用compose: repos/ 配下(scripts/sync-repos.shで取得)をコンテナにマウントし、
# Dockerfile.core からビルドする。
# Phase 1 (2026-07): authored, build-untested — docker未導入の開発機で書かれたため
# `docker compose up` はまだ一度も実行できていない。
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    image: petit-core:dev
    container_name: petit-core
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PETIT_DATA_DIR: /data
      CHARACTER_IDS: ${CHARACTER_IDS:-alice}
    ports:
      - "${DASHBOARD_PORT:-8765}:8765"
    volumes:
      - petit-data:/data
      - petit-claude-auth:/home/petit/.claude
      # コンポーネント本体は :ro を付けない。コンテナ内の uv run が .venv を作るため
      # (entrypoint.sh / run-for-each-character.sh / autonomous-mcp.json)。
      # そのかわり .venv のパスにだけ匿名ボリュームを被せて、ホスト側に venv を作らせない。
      # ホストの .venv はホストのアーキ・OS のものなので ARM Linux コンテナでは使えない。
      # 詳細は docs/cloud/TODO.md の T3。
      - ./repos/petit-mcp:/opt/petit/repos/petit-mcp
      - /opt/petit/repos/petit-mcp/.venv
      - ./repos/m5-petit-app:/opt/petit/repos/m5-petit-app
      - /opt/petit/repos/m5-petit-app/.venv
      - ./repos/petit-memory:/opt/petit/repos/petit-memory
      - /opt/petit/repos/petit-memory/.venv
      - ./repos/petit-desire:/opt/petit/repos/petit-desire
      - /opt/petit/repos/petit-desire/.venv
      - ./repos/petit-scripts:/opt/petit/repos/petit-scripts
      - /opt/petit/repos/petit-scripts/.venv
      # キャラ雛形はコンテナから書かないので :ro のまま
      - ./sample-character:/opt/petit/sample-character:ro
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  petit-data:
  petit-claude-auth:
