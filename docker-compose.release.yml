# release用compose: ビルド済みイメージを使う(Phase 4で運用開始予定の雛形)。
# コンポーネントのコードはイメージビルド時にCOPY済みのため repos/ のバインドマウントは無い。
# 未実装: Dockerfile.core にはコンポーネントを COPY する行がまだ無い(コメントのみ)。
# 未公開: ghcr.io/teampuchi/petit-core は存在しない。
# なお EC2 での実運用側の compose は petit-infra/compose/docker-compose.yml が正本で、
# そちらはローカル build した petit-core:latest を参照している。
services:
  core:
    image: ${PETIT_CORE_IMAGE:-ghcr.io/teampuchi/petit-core:latest}
    container_name: petit-core
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PETIT_DATA_DIR: /data
      CHARACTER_IDS: ${CHARACTER_IDS:-alice}
    ports:
      - "${DASHBOARD_PORT:-8765}:8765"
    volumes:
      - petit-data:/data
      - petit-claude-auth:/home/petit/.claude
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  petit-data:
  petit-claude-auth:
