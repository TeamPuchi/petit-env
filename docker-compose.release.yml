# release用compose: ビルド済みイメージを使う(Phase 4で運用開始予定の雛形)。
# コンポーネントのコードはイメージビルド時にCOPY済みのため repos/ のバインドマウントは無い。
# build の前に ./scripts/vendor-components.sh で vendor/ を詰めること(K14・T4)。
# vendor/ が空だと build が落ちる(PETIT_REQUIRE_COMPONENTS=1 が既定)。
#
# タグは petit-infra/compose/docker-compose.yml の petit-mio の既定(`petit-core:latest`)と
# 揃えてある(K7で確認・修正)。 EC2 ホスト上で `docker compose -f docker-compose.release.yml build`
# すれば、レジストリを増やさずにそのまま petit-infra 側の compose から拾える。
# ghcr.io 等へ push/pull する運用に切り替えるときは PETIT_CORE_IMAGE を上書きする(Phase 4)。
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    image: ${PETIT_CORE_IMAGE:-petit-core:latest}
    container_name: petit-core
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PETIT_DATA_DIR: /data
      CHARACTER_IDS: ${CHARACTER_IDS:-alice}
    ports:
      - "${DASHBOARD_PORT:-8765}:8765"
    volumes:
      - petit-data:/data
      - petit-claude-auth:/home/petit/.claude
      # 埋め込みモデルのキャッシュ(HF_HOME)。dev 側と同じ理由で永続化する。
      - petit-hf-cache:/home/petit/.cache/huggingface
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  petit-data:
  petit-claude-auth:
  petit-hf-cache:
